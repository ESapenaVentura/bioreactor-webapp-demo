<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bioreactor Monitor — Cytiva Wave</title>
<link rel="stylesheet" href="/static/uPlot.min.css">
<style>
  :root {
    --bg:#f4f6f2; --panel:#fff; --ink:#16211f; --soft:#4c5a56; --faint:#7c8a85;
    --line:#dbe0d8; --accent:#0f5f5c; --ok:#2f6b3d; --warn:#9e5c00; --crit:#a32a21;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --pad: 1.5rem;   /* page gutter; the alarm strip's full-bleed margin tracks it */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0d1312; --panel:#151d1c; --ink:#e3e9e5; --soft:#a7b5b0; --faint:#7c8b86;
      --line:#26332f; --accent:#57beb6; --ok:#77be86; --warn:#dfa04a; --crit:#e58177;
    }
  }

  /* Colour-blind-safe palette — toggled from the toolbar, remembered per viewer.
     Only the four semantic hues change (accent / ok / warn / crit); neutrals stay.
     ok = blue, warn + crit = warm; the badges still spell the state out, so the
     warn/crit split never rests on colour alone. Tune the hex values here. */
  :root[data-palette="cvd"] {
    --accent:#5f4b8b; --ok:#00639b; --warn:#a66300; --crit:#c33700;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-palette="cvd"] {
      --accent:#b3a0e0; --ok:#5aa9dd; --warn:#e59b3c; --crit:#ff6a3d;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding:var(--pad);
    overflow-x:clip;   /* safety net; `clip` (not `hidden`) keeps position:sticky working */
  }
  header { display:flex; align-items:baseline; gap:.6rem 1rem; flex-wrap:wrap;
           padding-bottom:.55rem; }
  h1 { font-size:1.15rem; margin:0; letter-spacing:-.01em; font-weight:700; }
  .reactor-select { font:inherit; font-weight:600; font-size:.9rem; padding:.25rem .5rem;
                    background:var(--panel); color:var(--ink);
                    border:1px solid var(--line); border-radius:2px; }

  /* status band — the always-on summary: connection + counts + freshness */
  .statusband { display:flex; align-items:center; gap:.35rem 1rem; flex-wrap:wrap;
                font-family:var(--mono); font-size:.72rem; color:var(--soft);
                padding:.5rem 0; margin-bottom:1.1rem;
                border-bottom:2px solid var(--ink); }
  .sb-conn { display:flex; align-items:center; gap:.45rem;
             text-transform:uppercase; letter-spacing:.07em; font-size:.66rem; }
  .sb-conn .dot { width:.5rem; height:.5rem; border-radius:50%; background:var(--faint);
                  box-shadow:0 0 0 3px color-mix(in srgb, var(--faint) 20%, transparent); }
  .sb-conn.live .dot { background:var(--ok);
                       box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .sb-conn.warn .dot { background:var(--warn);
                       box-shadow:0 0 0 3px color-mix(in srgb, var(--warn) 22%, transparent); }
  .sb-conn.down .dot { background:var(--crit);
                       box-shadow:0 0 0 3px color-mix(in srgb, var(--crit) 22%, transparent); }
  .sb-chip { padding:.1em .5em; border-radius:2px; color:var(--faint); white-space:nowrap; }
  .sb-chip.alert { color:var(--crit); font-weight:700;
                   background:color-mix(in srgb, var(--crit) 14%, transparent); }
  .sb-updated { margin-left:auto; color:var(--faint); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(230px, 100%), 1fr));
          gap:.75rem; margin-bottom:1.5rem; }
  .tile { background:var(--panel); border:1px solid var(--line); padding:.7rem .85rem;
          border-left:3px solid var(--line); }
  .tile.ok   { border-left-color:var(--ok); }
  .tile.low, .tile.high { border-left-color:var(--warn); }
  .tile.anom { border-left-color:var(--crit); }
  .tile .name { font-size:.78rem; color:var(--soft); display:flex; justify-content:space-between;
                gap:.5rem; align-items:baseline; }
  .tile .cat { font-family:var(--mono); font-size:.6rem; letter-spacing:.08em;
               text-transform:uppercase; color:var(--faint); }
  .tile .val { font-family:var(--mono); font-size:1.5rem; font-variant-numeric:tabular-nums;
               margin:.15rem 0 .1rem; }
  .tile .val .u { font-size:.8rem; color:var(--faint); margin-left:.25rem; }
  .tile .sub { font-family:var(--mono); font-size:.68rem; color:var(--faint);
               display:flex; justify-content:space-between; gap:.5rem; }
  .tile .tile-tools { display:flex; align-items:center; gap:.7rem; margin-top:.45rem;
                      font-family:var(--mono); font-size:.62rem; color:var(--faint); }
  .tile .tile-tools label { display:flex; align-items:center; gap:.3rem; cursor:pointer; }
  .tile .tile-tools input { margin:0; }
  .tile .show-graph { font:inherit; font-size:.62rem; padding:.12rem .4rem; cursor:pointer;
                      border:1px solid var(--line); border-radius:2px;
                      background:var(--panel); color:var(--soft); }
  .tile .show-graph:hover { border-color:var(--accent); color:var(--accent); }
  .tile .ack { margin-top:.5rem; padding-top:.5rem; border-top:1px solid var(--line);
             display:flex; flex-direction:column; gap:.35rem; }
  .tile .ack-when { font-family:var(--mono); font-size:.66rem; color:var(--crit); }
  .tile .ack-btn { font:inherit; font-size:.72rem; padding:.3rem .5rem; cursor:pointer;
                  border:1px solid var(--crit); border-radius:2px; color:var(--crit);
                  background:color-mix(in srgb, var(--crit) 10%, transparent); }
  .tile .ack-btn:hover { background:color-mix(in srgb, var(--crit) 20%, transparent); }
  .badge { font-family:var(--mono); font-size:.58rem; letter-spacing:.08em;
           text-transform:uppercase; padding:.15em .45em; border-radius:2px; }
  .badge.low, .badge.high { background:color-mix(in srgb, var(--warn) 18%, transparent); color:var(--warn); }
  .badge.anom { background:color-mix(in srgb, var(--crit) 18%, transparent); color:var(--crit); }

  .charts { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap:1rem; }
  .chart { background:var(--panel); border:1px solid var(--line); padding:.85rem; }
  .chart[hidden] { display:none; }
  .chart h2 { font-size:.85rem; margin:0 0 .5rem; font-weight:600; }
  .chart.highlight { outline: 2px solid var(--accent); outline-offset:-2px; }
  .u-legend { font-size:.72rem; }

  .tools { display:flex; align-items:flex-start; justify-content:space-between;
           gap:.75rem 1rem; flex-wrap:wrap; margin-bottom:1.25rem; }
  select, button { font:inherit; font-size:.82rem; padding:.35rem .6rem;
                   background:var(--panel); color:var(--ink);
                   border:1px solid var(--line); border-radius:2px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .demo-controls { font-size:.8rem; }
  .demo-controls > summary { cursor:pointer; list-style:none; color:var(--faint);
                             font-family:var(--mono); font-size:.66rem;
                             text-transform:uppercase; letter-spacing:.07em; }
  .demo-controls > summary::-webkit-details-marker { display:none; }
  .demo-controls > summary::before { content:"\25B8  "; }
  .demo-controls[open] > summary::before { content:"\25BE  "; }
  .demo-body { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-top:.55rem; }
  .demo-body label { font-size:.78rem; color:var(--soft); }
  .demo-body .hint { flex-basis:100%; font-size:.72rem; color:var(--faint); max-width:44ch; }
  .cvd-opt { display:flex; align-items:center; gap:.4rem; cursor:pointer;
             font-size:.74rem; color:var(--faint); white-space:nowrap; }
  .cvd-opt input { margin:0; }

  /* collapsible sections (Dashboard, Anomalies) */
  .section { margin-top:1.5rem; border:1px solid var(--line); background:var(--panel); }
  .section-toggle { display:flex; align-items:center; gap:.5rem; width:100%; padding:.7rem .85rem;
                    border:0; background:none; cursor:pointer; font:inherit; font-weight:600;
                    color:var(--ink); text-align:left; }
  .section-toggle::before { content:"▾"; font-size:.7rem; color:var(--faint); }
  .section-toggle[aria-expanded="false"]::before { content:"▸"; }
  .section-toggle .count { font-family:var(--mono); font-size:.7rem; color:var(--faint);
                           background:color-mix(in srgb, var(--faint) 18%, transparent);
                           padding:.1em .5em; border-radius:999px; }
  .section-toggle .count.crit { color:var(--crit);
                                background:color-mix(in srgb, var(--crit) 15%, transparent); }
  #anomalies-count {
    color: var(--accent);
    background: color-mix(in srgb, var(--ok) 30%, transparent);
  }
  #dashboard-collapse { padding:.85rem; }
  #dashboard[data-empty="1"] .section-toggle .count { display:none; }

  .anom-toolbar { display:flex; align-items:center; gap:.4rem; padding:.5rem .85rem;
                  border-bottom:1px solid var(--line);
                  font-family:var(--mono); font-size:.72rem; color:var(--soft); }
  .anom-toolbar input { margin:0; }
  #anomalies-body { padding:0 .85rem; overflow-x:auto; }
  .anomalies table { width:100%; border-collapse:collapse; font-size:.82rem; }
  .anomalies table:not(.all-reactors) .reactor-col { display:none; }
  .anomalies th, .anomalies td { padding:.4rem .5rem; text-align:left;
                                border-bottom:1px solid var(--line); }
  .anomalies th { font-family:var(--mono); font-size:.62rem; letter-spacing:.08em;
                  text-transform:uppercase; color:var(--faint); }
  .anomalies td { font-variant-numeric:tabular-nums; }
  .anomalies .row-acked td { opacity:.5; }
  .anomalies .sel-col { width:1.6rem; text-align:center; }
  .anomalies .row-sel, .anomalies .sel-all { margin:0; cursor:pointer; }
  .anomalies .ack-cell { font-variant-numeric:normal; }
  .anomalies .ack-head { white-space:nowrap; }
  .anomalies .ack-head #ack-all { margin-left:.6rem; font:inherit; font-size:.66rem;
                                  text-transform:none; letter-spacing:0; padding:.2rem .5rem;
                                  border:1px solid var(--crit); border-radius:2px; color:var(--ok);
                                  background:color-mix(in srgb, var(--accent) 10%, transparent); cursor:pointer; }
  .anomalies .ack-head #ack-all:hover:not(:disabled) {
    background:color-mix(in srgb, var(--crit) 20%, transparent); }
  .anomalies .ack-head #ack-all:disabled { opacity:.35; cursor:default;
                                           border-color:var(--line); color:var(--faint); background:none; }
  .anomalies .ack-yes { color:var(--ok); font-weight:700; font-size:.95rem; }
  .anomalies .ack-btn { font:inherit; font-size:.7rem; padding:.25rem .55rem; cursor:pointer;
                        border:1px solid var(--crit); border-radius:2px; color:var(--crit);
                        background:color-mix(in srgb, var(--crit) 10%, transparent); }
  .anomalies .ack-btn:hover { background:color-mix(in srgb, var(--crit) 20%, transparent); }
  .bulk-bar { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap;
              padding:.5rem .85rem; border-bottom:1px solid var(--line);
              font-family:var(--mono); font-size:.72rem; color:var(--soft); }
  .bulk-bar[hidden] { display:none; }
  .bulk-bar button { font-size:.72rem; padding:.2rem .55rem; }
  .bulk-bar .spacer { flex:1; }
  .menu { position:relative; display:inline-block; }
  .menu-list { position:absolute; top:calc(100% + 4px); left:0; z-index:10; min-width:8rem;
               background:var(--panel); border:1px solid var(--line); border-radius:2px;
               box-shadow:0 4px 14px color-mix(in srgb, var(--ink) 18%, transparent); }
  .menu-list[hidden] { display:none; }
  .menu-list button { display:block; width:100%; text-align:left; border:0; border-radius:0;
                      background:none; padding:.35rem .6rem; font-size:.72rem; color:var(--ink); }
  .menu-list button:hover:not(:disabled) {
    background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent); }
  .menu-list button:disabled { color:var(--faint); cursor:default; }
  .pager { display:flex; align-items:center; gap:.75rem; padding:.6rem .85rem .85rem;
           font-family:var(--mono); font-size:.72rem; color:var(--faint); }
  .pager button { font:inherit; font-size:.72rem; padding:.2rem .55rem; }
  .pager button:disabled { opacity:.4; cursor:default; }
  .anomalies .kind-col { font-variant-numeric:normal; white-space:nowrap; }
  .anomalies .kbadge { font-family:var(--mono); font-size:.58rem; letter-spacing:.06em;
                       text-transform:uppercase; padding:.1em .4em; border-radius:2px; }
  .anomalies .kbadge.anomaly { background:color-mix(in srgb, var(--crit) 15%, transparent); color:var(--crit); }
  .anomalies .kbadge.low, .anomalies .kbadge.high {
    background:color-mix(in srgb, var(--warn) 18%, transparent); color:var(--warn); }
  .anomalies .kthr { color:var(--faint); font-size:.72rem; margin-left:.3rem; }

  /* watchlist — the primary section: accent frame, no collapse */
  .alarm-strip { position:sticky; top:0; z-index:30;
                 margin:0 calc(-1 * var(--pad)) 1.25rem; padding:.6rem var(--pad);
                 background:var(--crit); color:#fff; cursor:pointer;
                 font-family:var(--mono); font-size:.8rem; font-weight:700;
                 display:flex; align-items:baseline; gap:.7rem; flex-wrap:wrap; }
  .alarm-strip[hidden] { display:none; }
  .alarm-strip .items { font-weight:400; font-size:.74rem; }
  .reactor-warn { font-family:var(--mono); font-size:.72rem; font-weight:700;
                  padding:.15em .55em; border-radius:999px; cursor:pointer;
                  border:1px solid var(--crit); color:var(--crit);
                  background:color-mix(in srgb, var(--crit) 15%, transparent); }
  .reactor-warn[hidden] { display:none; }
  /* a compact config panel — not a data table, so it doesn't span the page */
  .watchlist { border:2px solid var(--accent); margin-top:1.25rem; max-width:34rem; }
  .watchlist > .section-toggle { font-size:1rem;
                                 background:color-mix(in srgb, var(--accent) 12%, transparent);
                                 border-bottom:2px solid var(--accent); }
  .watchlist > .section-toggle[aria-expanded="false"] { border-bottom:0; }
  #watchlist[data-empty="1"] .section-toggle .count:not(.crit) { display:none; }
  #watchlist-collapse { padding:.5rem .85rem .85rem; }
  .watchlist-controls { display:flex; gap:.4rem; align-items:center; flex-wrap:wrap;
                        padding-bottom:.5rem; border-bottom:1px solid var(--line); }
  .watchlist-controls select, .watchlist-controls button { font-size:.76rem; padding:.25rem .5rem; }
  .wl-builder { display:flex; gap:.4rem; align-items:center; flex-wrap:wrap;
                padding:.6rem 0; border-bottom:1px solid var(--line); }
  .wl-builder select, .wl-builder input, .wl-builder button {
                font:inherit; font-size:.8rem; padding:.25rem .45rem;
                border:1px solid var(--line); border-radius:2px;
                background:var(--bg); color:var(--ink); }
  .wl-builder input { width:5rem; font-variant-numeric:tabular-nums; }
  .wl-builder button { cursor:pointer; background:var(--panel); }
  .wl-builder button:disabled { opacity:.4; cursor:default; }
  .wl-rows { padding-top:.4rem; display:flex; flex-direction:column; gap:.1rem; }
  .wl-rows:empty::before { content:"No sensors watched — add one above."; color:var(--faint);
                           font-size:.78rem; }
  .wl-row { display:flex; align-items:center; gap:.5rem; padding:.35rem 0;
            border-bottom:1px solid color-mix(in srgb, var(--line) 55%, transparent); }
  .wl-row:last-child { border-bottom:0; }
  .wl-row .wl-name { flex:0 0 9.5rem; font-size:.85rem;
                     white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wl-row input { flex:0 0 auto; width:4.5rem; font:inherit; font-size:.8rem; padding:.2rem .4rem;
                  border:1px solid var(--line); border-radius:2px;
                  background:var(--bg); color:var(--ink); font-variant-numeric:tabular-nums; }
  .wl-row input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .wl-row.invalid input { border-color:var(--crit); }
  .wl-row .wl-unit { flex:0 0 auto; min-width:1.4rem; font-family:var(--mono);
                     font-size:.66rem; color:var(--faint); }
  .wl-row .wl-state { flex:0 0 auto; }
  .wl-row .wl-row-unload { flex:0 0 auto; font:inherit; font-size:.66rem;
                          padding:.15rem .45rem; cursor:pointer;
                          border:1px solid var(--line); border-radius:2px;
                          background:var(--panel); color:var(--soft); }
  .wl-row .wl-row-unload:hover { border-color:var(--crit); color:var(--crit); }
  .wl-row.breached { background:color-mix(in srgb, var(--crit) 9%, transparent); }
  .wl-row.breached .wl-name { font-weight:700; }

  /* focused-graph overlay */
  .overlay { position:fixed; inset:0; z-index:50; display:flex; align-items:center;
             justify-content:center; padding:1.5rem;
             background:color-mix(in srgb, var(--ink) 55%, transparent); }
  .overlay[hidden] { display:none; }
  .overlay-box { background:var(--panel); border:1px solid var(--line); border-radius:4px;
                 width:min(980px, 100%); max-height:90vh; display:flex; flex-direction:column; }
  .overlay-head { display:flex; align-items:center; justify-content:space-between;
                  padding:.7rem 1rem; border-bottom:1px solid var(--line); }
  .overlay-head h2 { margin:0; font-size:1rem; }
  #overlay-close { border:0; background:none; font-size:1rem; padding:.2rem .55rem; line-height:1; }
  .overlay-chart { padding:1rem; }

  /* -------------------------------------------------- phones / narrow */
  @media (max-width: 700px) {
    :root { --pad: .8rem; }
    body { font-size:14px; }

    header { gap:.4rem .6rem; }
    h1 { font-size:1.05rem; flex-basis:100%; }
    .statusband { margin-bottom:1rem; }
    .sb-updated { margin-left:0; flex-basis:100%; }

    .tools { margin-bottom:1rem; }
    .demo-body label, .demo-body .hint { flex-basis:100%; }

    .grid { gap:.5rem; margin-bottom:1rem; }
    .section { margin-top:1rem; }
    .watchlist { max-width:none; }
    #dashboard-collapse, #watchlist-collapse { padding:.6rem; }
    #anomalies-body, .anom-toolbar, .bulk-bar, .watchlist-controls,
    .pager, .section-toggle { padding-left:.6rem; padding-right:.6rem; }

    .charts { gap:.6rem; }
    .chart { padding:.6rem; }
    .overlay { padding:.4rem; }
    .overlay-chart { padding:.5rem; }

    /* comfortable finger targets on the controls */
    .demo-body select, .demo-body button,
    .watchlist-controls select, .watchlist-controls button,
    .wl-builder select, .wl-builder input, .wl-builder button { min-height:2.4rem; }

    /* watchlist builder: sensor picker on its own line */
    .wl-builder { gap:.4rem; }
    #wl-add-sensor { flex:1 1 100%; min-width:0; }
    .wl-builder input { flex:1 1 6rem; width:auto; }
    #wl-add { flex:1 1 100%; }

    /* watchlist rows: let the name have its own line */
    .wl-row { flex-wrap:wrap; gap:.35rem .5rem; padding:.5rem 0; }
    .wl-row .wl-name { flex:1 1 100%; font-weight:600; font-size:.9rem; white-space:normal; }
    .wl-row input { flex:1 1 5rem; width:auto; min-height:2.2rem; }
    .wl-row .wl-row-unload { margin-left:auto; min-height:2rem; padding:.25rem .55rem; }

    /* anomaly table: let long labels wrap, tighten cells; it still scrolls sideways */
    .anomalies table { font-size:.76rem; }
    .anomalies th, .anomalies td { padding:.35rem .4rem; }
    .anomalies .ack-btn, .anomalies .ack-head #ack-all { white-space:normal; font-size:.66rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Cytiva Wave</h1>
  <select id="reactor" class="reactor-select" aria-label="Select reactor"></select>
  <button type="button" class="reactor-warn" id="reactor-warn" hidden
          aria-label="Watchlist alarms on other reactors"></button>
</header>

<div class="statusband" id="statusband">
  <span class="sb-conn warn" id="sb-conn"><span class="dot"></span><span class="label">connecting</span></span>
  <span class="sb-item" id="sb-sensors">— sensors</span>
  <span class="sb-chip" id="sb-breached">0 breached</span>
  <span class="sb-chip" id="sb-unacked">0 unacknowledged</span>
  <span class="sb-updated" id="sb-updated"></span>
</div>

<div class="alarm-strip" id="alarm-strip" hidden></div>

<div class="tools">
  <details class="demo-controls">
    <summary>Demo controls</summary>
    <div class="demo-body">
      <label for="sensor">Simulate a spike on</label>
      <select id="sensor"></select>
      <button id="inject">Push a fake reading</button>
      <span class="hint">Sends one synthetic out-of-range value so you can watch an alarm fire. Doesn't touch the instrument.</span>
    </div>
  </details>
  <label class="cvd-opt"><input type="checkbox" id="cvd-toggle"> Colour-blind palette</label>
</div>

<section class="section watchlist" id="watchlist" data-empty="1">
  <button type="button" class="section-toggle" aria-expanded="true" aria-controls="watchlist-collapse">
    Watchlist
    <span class="count" id="wl-count">0</span>
    <span class="count crit" id="wl-breached" hidden>0</span>
  </button>
  <div id="watchlist-collapse">
    <div class="watchlist-controls">
      <select id="wl-load" aria-label="Load a saved watchlist"><option value="">Load preset…</option></select>
      <button type="button" id="wl-save">Save as…</button>
      <button type="button" id="wl-unload">Unload all</button>
    </div>
    <div class="wl-builder">
      <select id="wl-add-sensor" aria-label="Sensor to watch"></select>
      <input type="number" step="any" inputmode="decimal" id="wl-add-min" placeholder="min">
      <input type="number" step="any" inputmode="decimal" id="wl-add-max" placeholder="max">
      <button type="button" id="wl-add" disabled>Add</button>
    </div>
    <div class="wl-rows" id="wl-rows"></div>
  </div>
</section>

<div class="grid" id="tiles"></div>

<section class="section" id="dashboard">
  <button type="button" class="section-toggle" aria-expanded="true" aria-controls="dashboard-collapse">
    Dashboard <span class="count" id="dashboard-count">0</span>
  </button>
  <div id="dashboard-collapse">
    <div class="charts" id="charts"></div>
  </div>
</section>

<section class="section anomalies" id="anomalies" hidden>
  <button type="button" class="section-toggle" aria-expanded="true" aria-controls="anomalies-collapse">
    Anomalies
    <span class="count" id="anomalies-count">0</span>
    <span class="count crit" id="anomalies-unacked" hidden>0</span>
  </button>
  <div id="anomalies-collapse">
    <div class="anom-toolbar">
      <label><input type="checkbox" id="anom-all"> Show all reactors</label>
    </div>
    <div class="bulk-bar" id="bulk-bar" hidden>
      <span id="bulk-count">0 selected</span>
      <span class="menu" id="export-menu">
        <button type="button" id="export-btn" aria-haspopup="true" aria-expanded="false">Export ▾</button>
        <div class="menu-list" id="export-list" hidden>
          <button type="button" data-fmt="csv">To CSV</button>
          <button type="button" data-fmt="xlsx" disabled
                  title="Not available in the browser — CSV files open directly in Excel">To Excel</button>
        </div>
      </span>
      <button type="button" id="bulk-ack">Mark as acknowledged</button>
      <span class="spacer"></span>
      <button type="button" id="bulk-clear">Clear</button>
    </div>
    <div id="anomalies-body">
      <table>
        <thead>
          <tr>
            <th class="sel-col"><input type="checkbox" class="sel-all" aria-label="Select all on this page"></th>
            <th class="reactor-col">Reactor</th>
            <th>Sensor</th><th>Value</th><th>Timestamp</th><th class="kind-col">Type</th>
            <th class="ack-head">
              <span>Acknowledged</span>
              <button type="button" id="ack-all" disabled>Acknowledge all</button>
            </th>
          </tr>
        </thead>
        <tbody id="anomalies-rows"></tbody>
      </table>
    </div>
    <div id="anomalies-pager" class="pager" hidden></div>
  </div>
</section>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-box">
    <div class="overlay-head">
      <h2 id="overlay-title">—</h2>
      <button type="button" id="overlay-close" aria-label="Close">✕</button>
    </div>
    <div class="overlay-chart" id="overlay-chart"></div>
  </div>
</div>

<script src="/static/uPlot.iife.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
